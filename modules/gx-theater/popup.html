<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GX Theater</title>
  <style>
    body {
      width: 280px;
      background: #1a0f3a;
      color: #ffd2a3;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 12px;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #ff7b5c;
      border-bottom: 1px solid #4a3a8a;
      padding-bottom: 6px;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #2b1d5e;
    }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-label { font-size: 13px; }
    .toggle {
      width: 38px;
      height: 20px;
      background: #4a3a8a;
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle.on { background: #ff7b5c; }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #ffe4cc;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(18px); }
  </style>
</head>
<body>
  <h2>🎬 GX Theater</h2>
  <div class="toggle-row">
    <span class="toggle-label">Cinema Mode</span>
    <div class="toggle on" data-key="cinema_mode"></div>
  </div>
  <div class="toggle-row">
    <span class="toggle-label">Pop-out Player</span>
    <div class="toggle on" data-key="pop_out"></div>
  </div>
  <div class="toggle-row">
    <span class="toggle-label">Subtitle Enhance</span>
    <div class="toggle" data-key="subtitle_enhance"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
