<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GX Control</title>
  <style>
    body {
      width: 280px;
      background: #1a0f3a;
      color: #ffd2a3;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 12px;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #ff7b5c;
      border-bottom: 1px solid #4a3a8a;
      padding-bottom: 6px;
    }
    .resource-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
    }
    .bar-bg {
      width: 100%;
      height: 6px;
      background: #0b0d17;
      border: 1px solid #4a3a8a;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(to right, #ff7b5c, #ffd2a3);
      transition: width 0.4s ease;
      border-radius: 3px;
    }
    .boost-btn {
      width: 100%;
      margin-top: 12px;
      background: linear-gradient(to right, #2b1d5e, #4a3a8a);
      border: 1px solid #9d7aff;
      color: #ffe4cc;
      padding: 10px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
    }
    .boost-btn:hover {
      background: linear-gradient(to right, #ff7b5c, #ffc48c);
      color: #0b0d17;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #2b1d5e;
    }
    .toggle {
      width: 38px;
      height: 20px;
      background: #4a3a8a;
      border-radius: 10px;
      position: relative;
      cursor: pointer;
    }
    .toggle.on { background: #ff7b5c; }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #ffe4cc;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(18px); }
  </style>
</head>
<body>
  <h2>⚡ GX Control</h2>
  <div class="resource-row">
    <span>RAM</span>
    <span id="ram-text">-- MB</span>
  </div>
  <div class="bar-bg"><div class="bar-fill" id="ram-bar" style="width: 0%"></div></div>
  <div class="resource-row">
    <span>CPU</span>
    <span id="cpu-text">-- %</span>
  </div>
  <div class="bar-bg"><div class="bar-fill" id="cpu-bar" style="width: 0%"></div></div>
  <div class="toggle-row">
    <span class="toggle-label">Network Booster</span>
    <div class="toggle on" data-key="network_booster"></div>
  </div>
  <div class="toggle-row">
    <span class="toggle-label">Limit Background Tabs</span>
    <div class="toggle" data-key="limit_background_tabs"></div>
  </div>
  <button class="boost-btn" id="boost">🚀 Boost Now</button>
  <script src="popup.js"></script>
</body>
</html>
