<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GX Music</title>
  <style>
    body {
      width: 280px;
      background: #1a0f3a;
      color: #ffd2a3;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 12px;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #b8a3ff;
      border-bottom: 1px solid #4a3a8a;
      padding-bottom: 6px;
    }
    .provider {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .provider button {
      flex: 1;
      background: #2b1d5e;
      border: 1px solid #4a3a8a;
      color: #ffd2a3;
      padding: 6px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
    }
    .provider button.active {
      background: #ff7b5c;
      color: #0b0d17;
      border-color: #ff7b5c;
      font-weight: bold;
    }
    .track-info {
      background: #0b0d17;
      border: 1px solid #4a3a8a;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
    }
    .track-title { color: #ffc48c; font-weight: bold; margin-bottom: 4px; }
    .track-artist { color: #9d7aff; font-size: 11px; }
    .controls {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .controls button {
      flex: 1;
      background: #4a3a8a;
      border: none;
      color: #ffe4cc;
      padding: 6px;
      cursor: pointer;
      border-radius: 3px;
      font-size: 12px;
    }
    .controls button:hover { background: #ff7b5c; color: #0b0d17; }
    .visualizer {
      height: 40px;
      background: #0b0d17;
      border: 1px solid #4a3a8a;
      margin-top: 8px;
      border-radius: 4px;
      display: flex;
      align-items: flex-end;
      gap: 1px;
      padding: 2px;
      overflow: hidden;
    }
    .bar {
      flex: 1;
      background: linear-gradient(to top, #ff7b5c, #ffd2a3);
      border-radius: 1px 1px 0 0;
      transition: height 0.1s ease;
    }
    .pinterest-theme {
      margin-top: 10px;
      border-top: 1px solid #4a3a8a;
      padding-top: 8px;
    }
    .pinterest-theme label {
      font-size: 11px;
      color: #b8a3ff;
      display: block;
      margin-bottom: 4px;
    }
    .pinterest-theme input[type="text"] {
      width: 100%;
      background: #0b0d17;
      border: 1px solid #4a3a8a;
      color: #ffd2a3;
      padding: 4px;
      border-radius: 3px;
      font-size: 11px;
    }
    .track-library {
      margin-top: 10px;
      border-top: 1px solid #4a3a8a;
      padding-top: 8px;
    }
    .track-library label {
      font-size: 11px;
      color: #b8a3ff;
      display: block;
      margin-bottom: 4px;
    }
    .track-library input[type="text"] {
      width: 100%;
      background: #0b0d17;
      border: 1px solid #4a3a8a;
      color: #ffd2a3;
      padding: 4px;
      border-radius: 3px;
      font-size: 11px;
      margin-bottom: 4px;
    }
    .track-library button {
      width: 100%;
      background: #4a3a8a;
      border: none;
      color: #ffe4cc;
      padding: 5px;
      cursor: pointer;
      border-radius: 3px;
      font-size: 11px;
      margin-top: 4px;
    }
    .track-library button:hover { background: #ff7b5c; color: #0b0d17; }
    .track-list {
      margin-top: 8px;
      max-height: 120px;
      overflow-y: auto;
      background: #0b0d17;
      border: 1px solid #4a3a8a;
      border-radius: 3px;
      padding: 4px;
      font-size: 11px;
      color: #ffd2a3;
    }
    .track-list:empty::before {
      content: 'No tracks in library';
      color: #6a5a9a;
    }
    .track-item {
      padding: 3px 4px;
      border-bottom: 1px solid #1a1a3a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .track-item:last-child { border-bottom: none; }
    .track-item-title { color: #ffc48c; }
    .track-item-artist { color: #9d7aff; font-size: 10px; }
    .track-item-remove {
      background: transparent;
      border: none;
      color: #ff7b5c;
      cursor: pointer;
      font-size: 10px;
      padding: 0 4px;
    }
    .shuffle-status {
      margin-top: 6px;
      font-size: 11px;
      text-align: center;
      color: #9d7aff;
    }
  </style>
</head>
<body>
  <h2>🎵 GX Music</h2>
  <div class="provider">
    <button id="yt" class="active">YouTube</button>
    <button id="spotify">Spotify</button>
    <button id="soundcloud">SoundCloud</button>
  </div>
  <div class="track-info">
    <div class="track-title">No track playing</div>
    <div class="track-artist">Select a provider to start</div>
    <div class="controls">
      <button id="prev">⏮</button>
      <button id="shuffle">⇄</button>
      <button id="play">▶</button>
      <button id="next">⏭</button>
    </div>
  </div>
  <div class="visualizer" id="visualizer"></div>
  <div class="shuffle-status" id="shuffle-status">↕ Sequential</div>
  <div class="track-library">
    <label>Add Track to Library:</label>
    <input type="text" id="track-title-input" placeholder="Track title" />
    <input type="text" id="track-artist-input" placeholder="Artist" />
    <button id="add-track">+ Add to Library</button>
    <div class="track-list" id="track-list"></div>
  </div>
  <div class="pinterest-theme">
    <label>Pinterest Theme Board URL:</label>
    <input type="text" id="pinterest-url" placeholder="https://pinterest.com/username/board/" />
  </div>
  <script src="popup.js"></script>
</body>
</html>
