<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GX Music</title>
  <style>
    body {
      width: 280px;
      background: #1a0f3a;
      color: #ffd2a3;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 12px;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #b8a3ff;
      border-bottom: 1px solid #4a3a8a;
      padding-bottom: 6px;
    }
    .provider {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .provider button {
      flex: 1;
      background: #2b1d5e;
      border: 1px solid #4a3a8a;
      color: #ffd2a3;
      padding: 6px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
    }
    .provider button.active {
      background: #ff7b5c;
      color: #0b0d17;
      border-color: #ff7b5c;
      font-weight: bold;
    }
    .track-info {
      background: #0b0d17;
      border: 1px solid #4a3a8a;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
    }
    .track-title { color: #ffc48c; font-weight: bold; margin-bottom: 4px; }
    .track-artist { color: #9d7aff; font-size: 11px; }
    .controls {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .controls button {
      flex: 1;
      background: #4a3a8a;
      border: none;
      color: #ffe4cc;
      padding: 6px;
      cursor: pointer;
      border-radius: 3px;
      font-size: 12px;
    }
    .controls button:hover { background: #ff7b5c; color: #0b0d17; }
    .visualizer {
      height: 40px;
      background: #0b0d17;
      border: 1px solid #4a3a8a;
      margin-top: 8px;
      border-radius: 4px;
      display: flex;
      align-items: flex-end;
      gap: 1px;
      padding: 2px;
      overflow: hidden;
    }
    .bar {
      flex: 1;
      background: linear-gradient(to top, #ff7b5c, #ffd2a3);
      border-radius: 1px 1px 0 0;
      transition: height 0.1s ease;
    }
    .pinterest-theme {
      margin-top: 10px;
      border-top: 1px solid #4a3a8a;
      padding-top: 8px;
    }
    .pinterest-theme label {
      font-size: 11px;
      color: #b8a3ff;
      display: block;
      margin-bottom: 4px;
    }
    .pinterest-theme input[type="text"] {
      width: 100%;
      background: #0b0d17;
      border: 1px solid #4a3a8a;
      color: #ffd2a3;
      padding: 4px;
      border-radius: 3px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h2>🎵 GX Music</h2>
  <div class="provider">
    <button id="yt" class="active">YouTube</button>
    <button id="spotify">Spotify</button>
    <button id="soundcloud">SoundCloud</button>
  </div>
  <div class="track-info">
    <div class="track-title">No track playing</div>
    <div class="track-artist">Select a provider to start</div>
    <div class="controls">
      <button id="prev">⏮</button>
      <button id="play">▶</button>
      <button id="next">⏭</button>
    </div>
  </div>
  <div class="visualizer" id="visualizer"></div>
  <div class="pinterest-theme">
    <label>Pinterest Theme Board URL:</label>
    <input type="text" id="pinterest-url" placeholder="https://pinterest.com/username/board/" />
  </div>
  <script src="popup.js"></script>
</body>
</html>
